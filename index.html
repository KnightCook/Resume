<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knighthunter Thorin Cook - Resume & Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-gradient: radial-gradient(circle at 15% 50%, #161033, #050505 50%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #0ea5e9;
            --accent-purple: #8b5cf6;
            --accent-dsg: #ff7b72;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.7;
            margin: 0;
            padding: 0;
        }
        
        /* Glassmorphism Header */
        header {
            text-align: center;
            padding: 6rem 2rem 5rem;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Ambient Header Glow */
        header::before {
            content: '';
            position: absolute;
            top: -50%; left: 50%;
            transform: translateX(-50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .profile-pic {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid transparent;
            background-image: linear-gradient(var(--bg-dark), var(--bg-dark)), linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 { 
            font-size: 4rem; 
            margin-bottom: 0.5rem; 
            letter-spacing: -1.5px; 
            background: linear-gradient(90deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 1;
        }
        
        .title-tag {
            font-size: 1.4rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 3rem 2rem; }
        
        h2 { 
            font-size: 2.2rem;
            color: #fff;
            margin-top: 3rem; 
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--glass-border), transparent);
        }

        h3 { color: var(--accent-cyan); margin-bottom: 0.2rem; font-size: 1.3rem; }
        h4 { color: var(--text-muted); margin-top: 0; margin-bottom: 1rem; font-weight: 500; }

        /* Glassmorphism Cards */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(14, 165, 233, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(14, 165, 233, 0.1);
        }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 2rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }
        
        ul { padding-left: 1.2rem; margin-top: 0.5rem; }
        ul li { margin-bottom: 0.8rem; color: #cbd5e1; }
        ul li::marker { color: var(--accent-cyan); }

        /* Experience Job Header Flexbox */
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }

            background: rgba(14, 165, 233, 0.1);
            color: var(--accent-cyan);
            padding: 4px 12px;
            border-radius: 20px;
